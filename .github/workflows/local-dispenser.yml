name: Local dispenser contract and firmware
on:
  pull_request:
    paths:
      - 'firmware/RelivLocalDispenser/**'
      - 'src/services/dispenseReceipt.js'
      - 'src/services/lateDispenseAck.js'
      - 'src/services/finalizeDispenseAck.js'
      - 'src/services/fulfillmentManager.js'
      - 'src/services/reserveDispenseStock.js'
      - 'tests/dispense-stock-reservation.mjs'
      - 'tests/dispense-receipt.mjs'
      - 'tests/motor-cycle.cpp'
      - 'tests/motor-queue.cpp'
      - 'tests/late-dispense-ack.mjs'
      - '.github/workflows/local-dispenser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/dispense-receipt.mjs tests/late-dispense-ack.mjs test-atomic-stock.js tests/dispense-stock-reservation.mjs
      - run: g++ -std=c++11 -Wall -Wextra -Werror tests/motor-cycle.cpp -o /tmp/cycles && /tmp/cycles
      - run: g++ -std=c++11 -Wall -Wextra -Werror tests/motor-queue.cpp -o /tmp/queue && /tmp/queue
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 and sketch libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2
          arduino-cli lib install "PubSubClient@2.8" "ArduinoJson@7.4.2"
      - name: Compile the real ESP32 sketch
        run: |
          cp firmware/RelivLocalDispenser/local_config.example.h firmware/RelivLocalDispenser/local_config.h
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/RelivLocalDispenser

