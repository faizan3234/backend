# Add as a separate nginx server block; it does not replace the kiosk site.
# Only HTTP connectivity probes are redirected. Never intercept HTTPS.
server {
    listen 80;
    server_name captive.apple.com connectivitycheck.gstatic.com
        connectivitycheck.android.com clients3.google.com
        www.msftconnecttest.com www.msftncsi.com;
    add_header Cache-Control "no-store" always;
    return 302 http://192.168.50.1/advertise;
}
