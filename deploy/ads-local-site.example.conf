# Example ONLY when there is no existing port-80 kiosk site.
# If a site already exists, merge the SPA fallback and API proxy into it.
server {
    listen 80;
    server_name 192.168.50.1;
    root /home/reliv/reliv-frontend/dist;
    index index.html;
    client_max_body_size 5m;
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
